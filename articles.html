<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essays & In-Depth Articles — Nitya Prerna</title>
  <meta name="description" content="Thoughtful long-form essays exploring Indian temple architecture, Vedic cosmology, philosophy, and cultural heritage.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B65322' stroke-width='2'><path d='M12 2C8 6 4 11 4 16a8 8 0 0 0 16 0c0-5-4-10-8-14z'/></svg>">
</head>
<body>

  <div id="site-header-root"></div>

  <!-- Page Header -->
  <section style="background-color:var(--bg-secondary); padding:4rem 0 3rem; border-bottom:1px solid var(--border-color); text-align:center;">
    <div class="container">
      <span class="section-tag">
        <span>📖</span> Heritage Reflections
      </span>
      <h1>Essays & In-Depth Articles</h1>
      <div class="divider-ornament"><span>✦</span></div>
      <p style="max-width:700px; margin:0 auto;">
        Deep explorations into sacred temple geometry, classical arts, Vedic astronomy, and the philosophical foundations of Indian civilization.
      </p>
    </div>
  </section>

  <!-- Content Section -->
  <section style="padding:4rem 0 6rem;">
    <div class="container">
      <!-- Search Input -->
      <div style="margin-bottom:2.5rem; max-width:480px;">
        <input type="text" id="article-search-input" placeholder="Search essays and articles..." class="form-control">
      </div>

      <!-- Articles Grid -->
      <div class="posts-grid" id="articles-container">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <div id="site-footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("site-header-root").innerHTML = renderGlobalHeader('articles');
    document.getElementById("site-footer-root").innerHTML = renderGlobalFooter();

    const allArticles = StorageManager.getAll(false).filter(p => p.type === 'article' || p.category === 'Articles');

    function renderArticles(list) {
      const container = document.getElementById("articles-container");
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">${Icons.book}</div>
            <h3>No Essays Found</h3>
            <p>Try searching for other topics or add new articles in the Admin dashboard.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => `
        <article class="article-card">
          <div class="article-card-image" style="height:220px;">
            <img src="${item.coverImage}" alt="${item.title}" loading="lazy">
            <span class="card-category-badge">Article</span>
          </div>
          <div class="article-card-body">
            <div class="article-card-meta">
              <span>${Icons.calendar} ${formatDate(item.publishDate)}</span>
              <span>•</span>
              <span>${Icons.clock} ${item.readTime || '5 min'}</span>
            </div>
            <h3 class="article-card-title">
              <a href="post.html?id=${item.id}">${item.title}</a>
            </h3>
            <p class="article-card-excerpt">
              ${item.shortDescription}
            </p>
            <div class="article-card-footer">
              <span class="article-author">By ${item.author || 'Nitya Prerna'}</span>
              <a href="post.html?id=${item.id}" class="btn-link" style="font-weight:700;">
                Read Essay ${Icons.arrowRight}
              </a>
            </div>
          </div>
        </article>
      `).join('');
    }

    document.getElementById("article-search-input").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = allArticles.filter(a => 
        (a.title || "").toLowerCase().includes(q) ||
        (a.shortDescription || "").toLowerCase().includes(q) ||
        (a.content || "").toLowerCase().includes(q)
      );
      renderArticles(filtered);
    });

    renderArticles(allArticles);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Search — Nitya Prerna</title>
  <meta name="description" content="Search across daily inspirations, Indian historical milestones, mythological scriptures, and great personalities.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B65322' stroke-width='2'><path d='M12 2C8 6 4 11 4 16a8 8 0 0 0 16 0c0-5-4-10-8-14z'/></svg>">
</head>
<body>

  <div id="site-header-root"></div>

  <!-- Search Header -->
  <section style="background-color:var(--bg-secondary); padding:4.5rem 0 3.5rem; border-bottom:1px solid var(--border-color); text-align:center;">
    <div class="container" style="max-width:760px;">
      <span class="section-tag">
        <span>🔍</span> Repository Search
      </span>
      <h1 style="margin-bottom:1.5rem;">Explore Nitya Prerna</h1>
      
      <!-- Big Search Box -->
      <div style="position:relative; box-shadow:var(--shadow-md); border-radius:var(--radius-lg); overflow:hidden;">
        <input type="text" id="global-search-input" placeholder="Search personalities, historical events, shlokas, quotes, or keywords..." class="form-control" style="padding:1.1rem 3rem 1.1rem 1.25rem; font-size:1.1rem; border-color:var(--accent-secondary); background:#fff;">
        <span style="position:absolute; right:1.2rem; top:50%; transform:translateY(-50%); color:var(--accent-primary);">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
      </div>

      <!-- Quick suggestions -->
      <div style="margin-top:1rem; font-size:0.85rem; color:var(--text-secondary); display:flex; align-items:center; justify-content:center; gap:0.5rem; flex-wrap:wrap;">
        <span style="font-weight:600;">Popular searches:</span>
        <a href="javascript:void(0)" onclick="setSearch('Vivekananda')" style="text-decoration:underline;">Vivekananda</a> •
        <a href="javascript:void(0)" onclick="setSearch('Mangalyaan')" style="text-decoration:underline;">Mangalyaan</a> •
        <a href="javascript:void(0)" onclick="setSearch('Bhagavad Gita')" style="text-decoration:underline;">Bhagavad Gita</a> •
        <a href="javascript:void(0)" onclick="setSearch('Ambedkar')" style="text-decoration:underline;">Ambedkar</a> •
        <a href="javascript:void(0)" onclick="setSearch('Kalam')" style="text-decoration:underline;">Kalam</a>
      </div>
    </div>
  </section>

  <!-- Search Results Section -->
  <section style="padding:3.5rem 0 6rem;">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem;">
        <h2 id="search-results-heading" style="font-size:1.4rem;">Search Results</h2>
        <span id="search-count" style="font-weight:700; color:var(--accent-primary);"></span>
      </div>

      <div class="posts-grid" id="search-results-container">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <div id="site-footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("site-header-root").innerHTML = renderGlobalHeader('');
    document.getElementById("site-footer-root").innerHTML = renderGlobalFooter();

    const input = document.getElementById("global-search-input");
    const container = document.getElementById("search-results-container");
    const heading = document.getElementById("search-results-heading");
    const countEl = document.getElementById("search-count");

    // Check URL query param
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || '';
    if (initialQuery) {
      input.value = initialQuery;
    }

    function doSearch() {
      const q = input.value.trim();
      const results = StorageManager.search(q);

      heading.textContent = q ? `Results for "${q}"` : `All Entries (${results.length})`;
      countEl.textContent = `${results.length} item${results.length === 1 ? '' : 's'} found`;

      if (results.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">${Icons.search}</div>
            <h3>No results found for "${q}"</h3>
            <p>Try searching for a different person, date, or scripture, or explore our category pages.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = results.map(post => `
        <article class="article-card">
          <div class="article-card-image" style="height:190px;">
            <img src="${post.coverImage || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=800&q=80'}" alt="${post.title}" loading="lazy">
            <span class="card-category-badge">${post.category}</span>
          </div>
          <div class="article-card-body">
            <h3 class="article-card-title">
              <a href="post.html?id=${post.id}">${post.title}</a>
            </h3>
            <p class="article-card-excerpt">
              ${post.shortDescription || ''}
            </p>
            <div class="article-card-footer">
              <span class="article-author">By ${post.author || 'Nitya Prerna'}</span>
              <a href="post.html?id=${post.id}" class="btn-link" style="font-weight:700;">
                Read ${Icons.arrowRight}
              </a>
            </div>
          </div>
        </article>
      `).join('');
    }

    function setSearch(term) {
      input.value = term;
      doSearch();
    }

    input.addEventListener("input", doSearch);
    doSearch();
  </script>
</body>
</html>

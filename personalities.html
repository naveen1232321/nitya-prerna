<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Great Personalities of India — Nitya Prerna</title>
  <meta name="description" content="Biographies, achievements, and enduring legacies of India's freedom fighters, philosophers, scientists, and spiritual luminaries.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B65322' stroke-width='2'><path d='M12 2C8 6 4 11 4 16a8 8 0 0 0 16 0c0-5-4-10-8-14z'/></svg>">
</head>
<body>

  <div id="site-header-root"></div>

  <!-- Page Header -->
  <section style="background-color:var(--bg-secondary); padding:4rem 0 3rem; border-bottom:1px solid var(--border-color); text-align:center;">
    <div class="container">
      <span class="section-tag">
        <span>⭐</span> Luminaries & Icons
      </span>
      <h1>Great Personalities of Bharat</h1>
      <div class="divider-ornament"><span>✦</span></div>
      <p style="max-width:700px; margin:0 auto;">
        Celebrating the giants who awakened our national consciousness, unlocked scientific frontiers, defended our sovereignty, and guided generations with their selfless lives.
      </p>
    </div>
  </section>

  <!-- Content Section -->
  <section style="padding:4rem 0 6rem;">
    <div class="container">
      <!-- Domain Filter Tabs -->
      <div class="filter-tabs" id="personality-tabs">
        <button class="tab-btn active" onclick="filterPersonalities('All', this)">All Luminaries</button>
        <button class="tab-btn" onclick="filterPersonalities('Spiritual', this)">Spiritual & Vedanta</button>
        <button class="tab-btn" onclick="filterPersonalities('Freedom', this)">Freedom Fighters</button>
        <button class="tab-btn" onclick="filterPersonalities('Science', this)">Pioneering Scientists</button>
      </div>

      <!-- Personalities Grid -->
      <div class="posts-grid" id="personalities-container">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <div id="site-footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("site-header-root").innerHTML = renderGlobalHeader('personalities');
    document.getElementById("site-footer-root").innerHTML = renderGlobalFooter();

    const allPersons = StorageManager.getAll(false).filter(p => p.type === 'personality' || p.category === 'Great Personalities');

    function renderPersons(list) {
      const container = document.getElementById("personalities-container");
      if (!container) return;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state-icon">${Icons.user}</div>
            <h3>No Personalities Found</h3>
            <p>Try another filter or add new biographies from the Admin dashboard.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(p => `
        <article class="article-card">
          <div class="article-card-image" style="height:260px;">
            <img src="${p.coverImage}" alt="${p.fullName || p.title}" loading="lazy">
            <span class="card-category-badge">${p.lifespan || 'Immortal'}</span>
          </div>
          <div class="article-card-body">
            <h3 class="article-card-title">
              <a href="post.html?id=${p.id}">${p.fullName || p.title}</a>
            </h3>
            <p class="article-card-excerpt">
              ${p.shortDescription}
            </p>
            ${p.majorAchievements ? `
              <div style="margin-bottom:1rem; padding-top:0.75rem; border-top:1px solid var(--border-color);">
                <span style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; display:block; margin-bottom:0.4rem;">Key Milestone:</span>
                <span style="font-size:0.85rem; color:var(--text-primary); display:flex; align-items:flex-start; gap:0.4rem;">
                  ${Icons.check} <span>${p.majorAchievements[0]}</span>
                </span>
              </div>
            ` : ''}
            <div class="article-card-footer">
              <span class="article-author">${p.lifespan || ''}</span>
              <a href="post.html?id=${p.id}" class="btn-link" style="font-weight:700;">
                Full Biography ${Icons.arrowRight}
              </a>
            </div>
          </div>
        </article>
      `).join('');
    }

    function filterPersonalities(filter, btn) {
      document.querySelectorAll("#personality-tabs .tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      if (filter === 'All') {
        renderPersons(allPersons);
      } else {
        const filtered = allPersons.filter(p => {
          const tags = (p.tags || []).join(' ').toLowerCase();
          const desc = (p.shortDescription || '').toLowerCase();
          return tags.includes(filter.toLowerCase()) || desc.includes(filter.toLowerCase());
        });
        renderPersons(filtered);
      }
    }

    renderPersons(allPersons);
  </script>
</body>
</html>

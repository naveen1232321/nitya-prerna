<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Archive — Nitya Prerna</title>
  <meta name="description" content="Explore the comprehensive historical and spiritual archives of Nitya Prerna by month, category, and historical personality.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B65322' stroke-width='2'><path d='M12 2C8 6 4 11 4 16a8 8 0 0 0 16 0c0-5-4-10-8-14z'/></svg>">
</head>
<body>

  <div id="site-header-root"></div>

  <!-- Page Header -->
  <section style="background-color:var(--bg-secondary); padding:4rem 0 3rem; border-bottom:1px solid var(--border-color); text-align:center;">
    <div class="container">
      <span class="section-tag">
        <span>🗄️</span> Knowledge Vault
      </span>
      <h1>Comprehensive Archive</h1>
      <div class="divider-ornament"><span>✦</span></div>
      <p style="max-width:700px; margin:0 auto;">
        Filter through all published reflections, historical dates, shlokas, and biographies in our repository.
      </p>
    </div>
  </section>

  <!-- Filter & Archive List -->
  <section style="padding:3.5rem 0 6rem;">
    <div class="container">
      <!-- Filter Panel -->
      <div style="background:#fff; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:1.75rem; margin-bottom:2.5rem;">
        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1.2rem; align-items:flex-end;">
          <div>
            <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:0.4rem;">Category</label>
            <select id="archive-cat-select" class="form-control">
              <option value="All">All Categories</option>
              <option value="Daily Inspiration">Daily Inspiration</option>
              <option value="Historical Dates">Historical Dates</option>
              <option value="Mythological Wisdom">Mythological Wisdom</option>
              <option value="Great Personalities">Great Personalities</option>
              <option value="Articles">Essays & Articles</option>
            </select>
          </div>

          <div>
            <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:0.4rem;">Month</label>
            <select id="archive-month-select" class="form-control">
              <option value="All">All Months</option>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>

          <div>
            <label style="display:block; font-size:0.85rem; font-weight:700; margin-bottom:0.4rem;">Search Keyword</label>
            <input type="text" id="archive-search-input" placeholder="Type a keyword..." class="form-control">
          </div>

          <div>
            <button class="btn btn-secondary" onclick="resetArchiveFilters()" style="width:100%;">
              Reset Filters
            </button>
          </div>
        </div>
      </div>

      <!-- Results Count -->
      <div style="margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center;">
        <span id="archive-count" style="font-weight:700; color:var(--accent-primary); font-size:1.05rem;"></span>
      </div>

      <!-- Archive Table / List -->
      <div class="admin-card" style="padding:0; overflow:hidden;">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Category</th>
                <th>Title / Subject</th>
                <th>Date / Milestone</th>
                <th>Author / Source</th>
                <th style="text-align:right;">Action</th>
              </tr>
            </thead>
            <tbody id="archive-table-body">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("site-header-root").innerHTML = renderGlobalHeader('archive');
    document.getElementById("site-footer-root").innerHTML = renderGlobalFooter();

    const allPosts = StorageManager.getAll(false);

    function renderArchive() {
      const cat = document.getElementById("archive-cat-select").value;
      const month = document.getElementById("archive-month-select").value;
      const q = document.getElementById("archive-search-input").value.toLowerCase().trim();

      let filtered = allPosts;

      if (cat !== 'All') {
        filtered = filtered.filter(p => p.category.toLowerCase() === cat.toLowerCase());
      }

      if (month !== 'All') {
        const m = parseInt(month);
        filtered = filtered.filter(p => {
          if (p.historicalMonth) return p.historicalMonth === m;
          if (p.publishDate) {
            const parts = p.publishDate.split('-');
            return parseInt(parts[1]) === m;
          }
          return false;
        });
      }

      if (q) {
        filtered = filtered.filter(p => 
          (p.title || "").toLowerCase().includes(q) ||
          (p.shortDescription || "").toLowerCase().includes(q) ||
          (p.author || "").toLowerCase().includes(q) ||
          (p.associatedPersonality || "").toLowerCase().includes(q)
        );
      }

      const countEl = document.getElementById("archive-count");
      countEl.textContent = `Showing ${filtered.length} Archive Item${filtered.length === 1 ? '' : 's'}`;

      const tbody = document.getElementById("archive-table-body");
      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align:center; padding:3rem 1rem;">
              <p style="color:var(--text-muted); font-size:1.05rem;">No archive entries matched your filter criteria.</p>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(item => `
        <tr>
          <td>
            <span class="highlight-badge badge-inspiration" style="margin:0; font-size:0.75rem;">
              ${item.category}
            </span>
          </td>
          <td>
            <strong>
              <a href="post.html?id=${item.id}" style="color:var(--text-primary); font-size:1rem;">
                ${item.title}
              </a>
            </strong>
            <div style="font-size:0.82rem; color:var(--text-muted); margin-top:0.25rem;">
              ${item.shortDescription?.slice(0, 85) || ''}...
            </div>
          </td>
          <td style="white-space:nowrap; font-size:0.85rem;">
            ${item.historicalYear ? `<strong>${item.historicalYear}</strong> (Day: ${item.historicalMonth}/${item.historicalDay})` : formatDate(item.publishDate)}
          </td>
          <td style="font-size:0.85rem; color:var(--text-secondary);">
            ${item.associatedPersonality || item.author || 'Nitya Prerna'}
          </td>
          <td style="text-align:right;">
            <a href="post.html?id=${item.id}" class="btn btn-secondary btn-sm" style="padding:0.35rem 0.75rem;">
              Read ${Icons.arrowRight}
            </a>
          </td>
        </tr>
      `).join('');
    }

    function resetArchiveFilters() {
      document.getElementById("archive-cat-select").value = "All";
      document.getElementById("archive-month-select").value = "All";
      document.getElementById("archive-search-input").value = "";
      renderArchive();
    }

    document.getElementById("archive-cat-select").addEventListener("change", renderArchive);
    document.getElementById("archive-month-select").addEventListener("change", renderArchive);
    document.getElementById("archive-search-input").addEventListener("input", renderArchive);

    // Initial load
    renderArchive();
  </script>
</body>
</html>

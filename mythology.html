<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mythological & Spiritual Wisdom — Nitya Prerna</title>
  <meta name="description" content="Enduring teachings from the Bhagavad Gita, Ramayana, Mahabharata, and Upanishads with original Sanskrit verses, translations, and practical life lessons.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B65322' stroke-width='2'><path d='M12 2C8 6 4 11 4 16a8 8 0 0 0 16 0c0-5-4-10-8-14z'/></svg>">
</head>
<body>

  <div id="site-header-root"></div>

  <!-- Page Header -->
  <section style="background-color:var(--bg-secondary); padding:4rem 0 3rem; border-bottom:1px solid var(--border-color); text-align:center;">
    <div class="container">
      <span class="section-tag">
        <span>🕉️</span> Sanatana Dharma & Shlokas
      </span>
      <h1>Mythological & Scriptural Wisdom</h1>
      <div class="divider-ornament"><span>✦ ॐ ✦</span></div>
      <p style="max-width:720px; margin:0 auto;">
        Timeless philosophical nectar from the Bhagavad Gita, Ramayana, Mahabharata, and Upanishads—decoded with Sanskrit texts, clear English translations, and actionable lessons for contemporary living.
      </p>
    </div>
  </section>

  <!-- Content Section -->
  <section style="padding:3.5rem 0 6rem;">
    <div class="container">
      <!-- Scripture Filter Tabs -->
      <div class="filter-tabs" id="scripture-tabs">
        <button class="tab-btn active" onclick="filterScripture('All', this)">All Scriptures</button>
        <button class="tab-btn" onclick="filterScripture('Bhagavad Gita', this)">Bhagavad Gita</button>
        <button class="tab-btn" onclick="filterScripture('Ramayana', this)">Ramayana</button>
        <button class="tab-btn" onclick="filterScripture('Mahabharata', this)">Mahabharata</button>
        <button class="tab-btn" onclick="filterScripture('Upanishads', this)">Upanishads & Puranas</button>
      </div>

      <!-- Shlokas Grid -->
      <div id="mythology-container" style="display:flex; flex-direction:column; gap:2.5rem;">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <div id="site-footer-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("site-header-root").innerHTML = renderGlobalHeader('mythology');
    document.getElementById("site-footer-root").innerHTML = renderGlobalFooter();

    const allMyth = StorageManager.getAll(false).filter(p => p.type === 'mythology' || p.category === 'Mythological Wisdom');

    function renderMythology(items) {
      const container = document.getElementById("mythology-container");
      if (!container) return;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">${Icons.book}</div>
            <h3>No Teachings Found</h3>
            <p>Select another scripture or add a new verse from the Admin dashboard.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(item => `
        <article class="admin-card" style="padding:2.5rem; position:relative; overflow:hidden;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:1rem; margin-bottom:1.25rem;">
            <div>
              <span class="highlight-badge badge-inspiration" style="margin-bottom:0.4rem;">
                ${item.scripture || 'Vedic Scripture'}
              </span>
              <span style="font-size:0.85rem; color:var(--text-muted); margin-left:0.5rem; font-weight:600;">
                ${item.chapter || ''} ${item.verse ? `• ${item.verse}` : ''}
              </span>
            </div>
            <a href="post.html?id=${item.id}" class="btn btn-secondary btn-sm">
              Read Deep Analysis
            </a>
          </div>

          <h2 style="font-size:1.6rem; margin-bottom:1.25rem;">
            <a href="post.html?id=${item.id}" style="color:var(--text-primary);">${item.title}</a>
          </h2>

          <!-- Sanskrit Verse Box -->
          ${item.sanskritText ? `
            <div class="sanskrit-verse-box" style="margin:1rem 0 1.5rem;">
              <div class="sanskrit">${item.sanskritText}</div>
              <div class="translation">"${item.englishTranslation || ''}"</div>
              ${item.practicalLesson ? `
                <div style="margin-top:1.2rem; padding-top:1rem; border-top:1px dashed var(--border-color);">
                  <span class="lesson-badge">✨ Life Lesson for Today</span>
                  <p style="color:var(--text-primary); font-size:0.95rem; line-height:1.6;">${item.practicalLesson}</p>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <p style="font-size:1.025rem; color:var(--text-secondary); line-height:1.7; margin-bottom:1.5rem;">
            ${item.explanation || item.shortDescription}
          </p>

          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; padding-top:1rem; border-top:1px solid var(--border-color);">
            <div style="display:flex; gap:0.4rem; flex-wrap:wrap;">
              ${item.tags ? item.tags.map(t => `<span class="section-tag" style="margin:0; font-size:0.7rem;">#${t}</span>`).join('') : ''}
            </div>
            <a href="post.html?id=${item.id}" class="btn-link" style="font-weight:700;">
              Complete Commentary ${Icons.arrowRight}
            </a>
          </div>
        </article>
      `).join('');
    }

    function filterScripture(scripture, btn) {
      document.querySelectorAll("#scripture-tabs .tab-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");

      if (scripture === 'All') {
        renderMythology(allMyth);
      } else {
        const filtered = allMyth.filter(p => (p.scripture || "").toLowerCase().includes(scripture.toLowerCase()));
        renderMythology(filtered);
      }
    }

    renderScripture('All');
  </script>
</body>
</html>
